<div class="flex flex-col gap-4">
	<wtable
		[rows]="rows()"
		[columns]="columns()"
		[config]="config"
		[bindValue]="'id'"
		title="Products"
	>
	</wtable>

	@if (hasMore()) {
	<div class="flex justify-center">
		<button wbutton type="secondary" [disableSubmit]="true" [loading]="loading()" (wClick)="loadMore()">
			<span translate>Load more</span>
		</button>
	</div>
	}
</div>
