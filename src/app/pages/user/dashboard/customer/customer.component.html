<div class="grid gap-4">
	<div
		class="flex flex-col gap-4 rounded-[var(--radius-card)] border border-[var(--c-border)] bg-[var(--c-bg-secondary)] p-5 shadow-[var(--shadow-sm)] sm:p-4"
	>
		<form
			(submit)="wFormSubmit(); $event.preventDefault()"
			class="flex flex-col gap-3"
		>
			<winput
				[label]="translateService.translate('Name')() + ' *'"
				[placeholder]="translateService.translate('Enter the customer name...')()"
				[formField]="customerForm.name"
			></winput>

			<winput
				label="Email"
				[placeholder]="translateService.translate('Email')()"
				[formField]="customerForm.email"
				type="email"
			></winput>

			<winput
				label="Phone"
				[placeholder]="translateService.translate('Phone')()"
				[formField]="customerForm.phone"
				type="tel"
			></winput>

			<winput
				label="Notes"
				[placeholder]="translateService.translate('Notes')()"
				[formField]="customerForm.notes"
				type="textarea"
			></winput>

			<div class="mt-2 flex flex-wrap gap-2">
				<wbutton [disabled]="isSubmitDisabled()" type="primary">
					<span translate>Create</span>
				</wbutton>
			</div>
		</form>
	</div>
</div>
