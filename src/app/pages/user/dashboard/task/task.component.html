<div class="grid gap-4">
	<div
		class="flex flex-col gap-4 rounded-[var(--radius-card)] border border-[var(--c-border)] bg-[var(--c-bg-secondary)] p-5 shadow-[var(--shadow-sm)] sm:p-4"
	>
		<form (submit)="wFormSubmit(); $event.preventDefault()" class="flex flex-col gap-3">
			<winput
				label="Title"
				[placeholder]="translateService.translate('Enter the task title...')()"
				[formField]="taskForm.title"
			></winput>

			<winput
				label="Description"
				[placeholder]="translateService.translate('Enter the task description...')()"
				[formField]="taskForm.description"
				type="textarea"
			></winput>

			<winput
				label="Assignee"
				[placeholder]="translateService.translate('Enter the assignee email...')()"
				[formField]="taskForm.assignee"
				type="email"
			></winput>

			<winput
				label="Due date"
				[formField]="taskForm.dueDate"
				type="date"
			></winput>

			<div class="mt-2 flex flex-wrap gap-2">
				<wbutton [disabled]="isSubmitDisabled()" type="primary">
					<span translate>Create</span>
				</wbutton>
			</div>
		</form>
	</div>
</div>
