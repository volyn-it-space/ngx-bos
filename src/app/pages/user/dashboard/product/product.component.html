<div class="grid gap-4">
	<div
		class="flex flex-col gap-4 rounded-[var(--radius-card)] border border-[var(--c-border)] bg-[var(--c-bg-secondary)] p-5 shadow-[var(--shadow-sm)] sm:p-4"
	>
		<form (submit)="wFormSubmit(); $event.preventDefault()" class="flex flex-col gap-3">
			<winput
				[label]="translateService.translate('Name')() + ' *'"
				[placeholder]="translateService.translate('Name')()"
				[formField]="productForm.name"
			></winput>

			<winput
				label="SKU"
				[placeholder]="translateService.translate('SKU')()"
				[formField]="productForm.sku"
			></winput>

			<winput
				label="Price"
				[placeholder]="translateService.translate('Price')()"
				[formField]="productForm.price"
				type="number"
			></winput>

			<winput
				label="Description"
				[placeholder]="translateService.translate('Description')()"
				[formField]="productForm.description"
				type="textarea"
			></winput>

			<div class="mt-2 flex flex-wrap gap-2">
				<wbutton [disabled]="isSubmitDisabled()" type="primary">
					<span translate>Create</span>
				</wbutton>
			</div>
		</form>
	</div>
</div>
