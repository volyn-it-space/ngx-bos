@if (isMobile()) {
<button
	type="button"
	class="sidebar__backdrop fixed inset-x-0 top-0 bottom-[var(--topbar-h)]"
	[attr.aria-label]="translateService.translate('Menu')()"
	(click)="closeBackdrop($event)"
></button>
}

<aside
	class="sidebar z-[90] flex flex-col overflow-auto bg-[var(--c-bg-secondary)] p-5 shadow"
	[class.sidebar--min]="isMinimized()"
	[style.width.px]="widthPx()"
	[ngClass]="{
		'fixed right-0 top-0 bottom-[var(--topbar-h)] h-[calc(100dvh-var(--topbar-h))]': isMobile(),
		'md:fixed md:right-0 md:top-14 md:h-[calc(100dvh-56px)]': isPreview(),
		'md:sticky md:top-14 md:h-[calc(100dvh-56px)]': !isMobile() && !isPreview()
	}"
	(mouseleave)="sidebarService.disableBurgerHover = false; sidebarService.onBurgerHover(false)"
	(mouseenter)="sidebarService.disableBurgerHover = true"
>
	<div
		class="mt-1 flex items-center gap-2 rounded-[var(--radius)] px-2 py-1"
		[class]="isMinimized() ? 'justify-center' : 'justify-between'"
	>
		<a
			(click)="closeIfOverlay()"
			routerLink="/profile"
			class="inline-flex min-w-0 items-center gap-2 text-[var(--c-text-primary)] no-underline"
			[class]="isMinimized() ? 'flex-none justify-center' : 'flex-1'"
		>
			<img
				class="h-8 w-8 rounded-full"
				[src]="userService.thumb()"
				[attr.alt]="translateService.translate('User avatar')()"
				height="32"
				width="32"
			/>
			@if (showNames()) {
			<span class="truncate font-semibold" translate>Profile</span>
			}
		</a>
	</div>

	<hr class="my-2 border-0 border-t-2 border-t-[var(--c-text-primary)]" />

	@if (firebaseAuth.isAdmin()) {
	<material-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Activity log')() : ''"
		[ariaLabel]="translateService.translate('Activity log')()"
		(click)="closeIfOverlay()"
		routerLink="/admin/activity"
		icon="history"
	></material-icon>

	<material-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Settings')() : ''"
		[ariaLabel]="translateService.translate('Settings')()"
		(click)="closeIfOverlay()"
		routerLink="/admin/company"
		icon="business"
	></material-icon>

	<material-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Customers')() : ''"
		[ariaLabel]="translateService.translate('Customers')()"
		(click)="closeIfOverlay()"
		routerLink="/admin/customers"
		icon="groups"
	></material-icon>

	<material-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Products')() : ''"
		[ariaLabel]="translateService.translate('Products')()"
		(click)="closeIfOverlay()"
		routerLink="/admin/products"
		icon="inventory_2"
	></material-icon>

	<material-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Orders')() : ''"
		[ariaLabel]="translateService.translate('Orders')()"
		(click)="closeIfOverlay()"
		routerLink="/admin/orders"
		icon="receipt_long"
	></material-icon>

	<material-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Tasks')() : ''"
		[ariaLabel]="translateService.translate('Tasks')()"
		(click)="closeIfOverlay()"
		routerLink="/admin/tasks"
		icon="task_alt"
	></material-icon>

	<hr class="my-2 border-0 border-t-2 border-t-[var(--c-text-primary)]" />
	}

	@if (showEmployeeMenu()) {
	<material-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Customers')() : ''"
		[ariaLabel]="translateService.translate('Customers')()"
		(click)="closeIfOverlay()"
		routerLink="/customers"
		icon="groups"
	></material-icon>

	<material-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Products')() : ''"
		[ariaLabel]="translateService.translate('Products')()"
		(click)="closeIfOverlay()"
		routerLink="/products"
		icon="inventory_2"
	></material-icon>

	<material-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Orders')() : ''"
		[ariaLabel]="translateService.translate('Orders')()"
		(click)="closeIfOverlay()"
		routerLink="/orders"
		icon="receipt_long"
	></material-icon>

	<material-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Tasks')() : ''"
		[ariaLabel]="translateService.translate('Tasks')()"
		(click)="closeIfOverlay()"
		routerLink="/tasks"
		icon="task_alt"
	></material-icon>

	<hr class="my-2 border-0 border-t-2 border-t-[var(--c-text-primary)]" />
	}
</aside>
